<!DOCTYPE html>
<html> 
    <head> 
        <link rel="stylesheet" href="lifetoolsStyles.css">
    </head>
    <body>
        <nav>
            <ul>
                <li> <a> <img src="img/OmniToolLogo.png" alt="OmniToolLogo"> </a></li>
                <li> <p> <a href="#"> Overview & Hub </a> </p> </li>
                <li> <p> <a href="calculator.html"> Quick Math </a> </p> </li>
                <li> <p> <a href="lifetools.html"> Life Tools </a> </p> </li>
                <li> <p> <a href="#"> Play & Focus </a> </p> </li>
            </ul>
        </nav>

        <header> </header>

         <div class="temperature-card">
            <div class="card-header"> 
                <div class="icon-badge"> temp </div>
                <div class="card-header-titles">
                    <h2> Temperature Studio </h2>
                    <p>Precision thermodynamic scale conversion & landmark presets </p>
                </div>  

            </div>
            <div class="temperature-display">   
                <div class="display-text"> 
                    <div class="top-row">
                        <div class="top-readout"> 
                            <span class="display-value"> 21.0 </span>
                            <span class="display-unit"> °C </span>
                        </div>
                        <div class="comfort-badge">
                            <span class="badge-icon"> yes </span>   
                        </div>  
                    </div>
                    
                    <div class="multi-progress-bar">
                        <div class="progress-part" style="width: 15%;"> </div>
                        <div class="progress-remainder" style="width: 85%;"> </div>
                    </div>
                    
                    <div class="scale-markers">
                        <span> -20°C </span>
                        <span> 0°C </span>
                        <span> 50°C </span>
                        <span> 110°C+ </span>
                    </div>
                </div>

            </div>
            <div class="input-section">
                <div class="input-group">
                    <h1> Celsius </h1>
                    <div class="input-field">
                        <input type="text" value="21">
                        <span class="suffix"> °C </span>
                    </div>
                </div>
                
                <div class="input-group">
                    <h1> Fahrenheit </h1>
                    <div class="input-field">
                        <input type="text" value="69.8">
                        <span class="suffix"> °F </span>
                    </div>
                </div>
            </div>
            <div class="slider-section"> 
                <div class="slider-group"> 
                    <span> Continuous Dial </span>
                    <span class="range-text"> 21.0 °C / 69.8 °F </span>
                </div>
                <input type="range" min="0" max="100" value="15" class="range-slider">
            </div>
            
            <!-- Preset -->
            <span class="presets-label"> Atmospheric Presets </span>
            <div class="preset-buttons">
                <button class="preset-button"> Freezing </button>
                <button class="preset-button"> Room </button>
                <button class="preset-button preset-button--active"> +15% </button>
                <button class="preset-button"> Beach </button>
                <button class="preset-button"> Boiling </button>
            </div>

    </body>
</html>
