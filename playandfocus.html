<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="playandfocus.css">
    </head>
    <body>
        <!-- Nav -->
        <nav>
            <ul>
                <li> <a href="landing-page.html"> <img src="img/OmniToolLogo.png" alt="OmniToolLogo"> </a></li>
                <li> <p> <a href="index.html"> Overview & Hub </a> </p> </li>
                <li> <p> <a href="calculator.html"> Quick Math </a> </p> </li>
                <li> <p> <a href="lifetools.html"> Life Tools </a> </p> </li>
                <li> <p> <a href="playandfocus.html"> Play & Focus </a> </p> </li>
            </ul>
        </nav>

        <!-- Start -->
        <div class="focus-card">
            <div class="focus-header">
                <div class="icon-badge"> Time </div>
                <div class="focus-title">
                    <h2> Focus Pod </h2>
                    <p> Deep-Work cadence cycle</p>
                </div>
            </div>
            
            <div class="time-wrapper">
                <svg class="progress-ring" width="220" height="220"> 
                    <circle class="ring-track" cx="110" cy="110" r="95"> </circle>
                    <circle class="ring-progress" cx="110" cy="110" r="95"> </circle>
                </svg>  

                <div class="timer-text"> 
                    <span class="timer-value"> 25:00 </span>
                    <span class="timer-label"> DIAL SET</span>
                </div>
            </div>
            <div class="timer-buttons">
                <button class="timer-button"> 1m test </button>
                <button class="timer-button"> 5m break </button>
                <button class="timer-button"> 15m reset </button>
                <button class="timer-button"> 25m sprint </button>
                <button class="timer-button"> 45m deep </button>
            </div>
            <!-- Slider -->
            <div class="slider">
                <div class="slider-legend">
                    <h2> Fine-tune Duration </h2>
                </div>
                <div class="slider-input">
                    <button class="yearbutton minus"> - </button>
                    <span class="slider-value"> 25 </span>
                    <button class="yearbutton plus"> + </button>
                </div>
            </div>

            <div class="focus-buttons">
                <button class="focus-button focus-button--start"> Start </button>
                <button class="focus-button focus-button--pause"> Pause </button>
                <button class="focus-button focus-button--reset"> Reset </button>
            </div>
        </div>
        
        
    </body>
</html>
