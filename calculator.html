<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="calculatorStyles.css">
    </head>
    <body>
        <nav>
            <ul>
                <li> <a> <img src="img/OmniToolLogo.png" alt="OmniToolLogo"> </a></li>
                <li> <p> <a href="#"> Overview & Hub </a> </p> </li>
                <li> <p> <a href="#"> Quick Math </a> </p> </li>
                <li> <p> <a href="#"> Life Tools </a> </p> </li>
                <li> <p> <a href="#"> Play & Focus </a> </p> </li>
            </ul>
        </nav>

        <header> 
            
        </header>

        <h1> Quick Math Studio </h1>
        <p> Instant math keypad, dynamic, percentage drifts and ratio insights </p>

        <div class="calculator-card">
            <div id="calc-display" > 0 </div>

            <!-- Keyboard grid -->
             <div class="calculator-keyboard">
                <!-- Button operator -->
                <button class="button button--clear" onclick=""> C </button>
                <button class="button button--operator" onclick=""> del  </button>
                <button class="button button--operator" onclick=""> % </button>
                <button class="button button--operator" onclick=""> : </button> 
                <!-- Button nums -->

                <!-- Row 1 -->
                <button class="button" onclick=""> 7 </button> 
                <button class="button" onclick=""> 8 </button> 
                <button class="button" onclick=""> 9 </button> 
                <button class="button button--operator" onclick=""> x </button>

                <!-- Row 2 -->

                <button class="button" onclick=""> 4 </button> 
                <button class="button" onclick=""> 5 </button> 
                <button class="button" onclick=""> 6 </button> 
                <button class="button button--operator" onclick=""> - </button>

                <!-- Row 3 -->

                <button class="button" onclick=""> 1 </button> 
                <button class="button" onclick=""> 2 </button> 
                <button class="button" onclick=""> 3 </button> 
                <button class="button button--operator" onclick=""> + </button>

                <!-- Row 4 -->
                <button class="button" onclick=""> 0 </button> 
                
                <button class="button button--operator" onclick=""> = </button>
             </div>
        </div>
    </body>
</html>
